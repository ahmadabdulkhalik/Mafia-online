<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>مافيا أونلاين</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="card">

    <h1>🕵️ مافيا أونلاين</h1>

    <p>العب مع أصحابك — حتى 20 لاعب</p>

    <label for="name">اسمك</label>

    <input id="name" placeholder="اكتب اسمك" maxlength="20">

    <label for="room">رمز الغرفة</label>

    <input id="room" placeholder="مثلاً MAFIA123" maxlength="12">

    <button id="join">دخول الغرفة</button>

    <p id="message"></p>

    <section id="lobby" hidden>

      <h2>اللاعبون بالغرفة</h2>

      <ul id="players"></ul>

      <p>بانتظار بدء اللعبة...</p>

    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script src="app.js"></script>

</body>

</html>
